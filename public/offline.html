<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movin - Offline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        
        .container {
            max-width: 400px;
            padding: 40px 20px;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            background: #3b82f6;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #3b82f6;
        }
        
        h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #94a3b8;
        }
        
        p {
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .button:hover {
            background: #2563eb;
        }
        
        .icon {
            margin-bottom: 20px;
            font-size: 48px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📱</div>
        <div class="logo">M</div>
        <h1>Movin</h1>
        <h2>You're Offline</h2>
        <p>
            It looks like you're not connected to the internet. 
            Don't worry, you can still use some features of Movin while offline.
        </p>
        <button class="button" onclick="tryReconnect()">
            Try Again
        </button>
    </div>

    <script>
        function tryReconnect() {
            window.location.reload();
        }

        // Auto-retry when back online
        window.addEventListener('online', function() {
            window.location.reload();
        });
    </script>
</body>
</html>
